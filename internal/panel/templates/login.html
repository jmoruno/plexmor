{{template "head" .}}
<style nonce="{{.Nonce}}">
.top-lang{position:absolute;top:18px;right:clamp(16px,4vw,40px)}
.login{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
.login-box{width:min(460px,100%)}
.chain{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:10px;margin:40px 0 36px;color:var(--muted);font-size:13px}
.chain .end{display:grid;justify-items:center;gap:8px}
.chain .end i{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chain .end i svg{width:24px;height:24px}
.chain .end img{width:60px;height:60px}
.chain .wire{height:2px;background:linear-gradient(90deg,var(--line),var(--amber),var(--line));border-radius:2px;margin-bottom:26px}
.login h1{font-size:40px;line-height:1.05;letter-spacing:-.03em;font-variation-settings:"opsz" 96}
.login p.lead{color:var(--muted);font-size:17px;margin:14px 0 28px;max-width:38ch}
.login .btn{width:100%;justify-content:center;padding:14px 18px;font-size:16px}
.note{margin-top:16px;color:var(--muted);font-size:14px;min-height:22px}
.note.error{color:var(--bad)}
.first{margin-top:22px;padding:12px 14px;border-radius:var(--r-m);background:var(--amber-glow);color:var(--text);font-size:14px}
.version{margin-top:40px;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div class="top-lang">{{template "langswitch" .}}</div>
<main class="login">
  <div class="login-box">
    <a class="brand" href="/"><img src="/static/logo.svg" alt=""><span>Plexmor</span></a>
    <div class="chain" aria-hidden="true">
      <div class="end"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></svg></i>{{t "login.plex"}}</div>
      <div class="wire"></div>
      <div class="end"><img src="/static/logo.svg" alt="">Plexmor</div>
      <div class="wire"></div>
      <div class="end"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M10.5 9l4 2-4 2z"/></svg></i>Stremio</div>
    </div>
    <h1>{{t "login.title"}}</h1>
    <p class="lead">{{t "login.lead"}}</p>
    <button class="btn" id="login">{{t "login.button"}}</button>
    <p class="note" id="msg" role="status"></p>
    {{if .FirstRun}}<p class="first">{{t "login.first"}}</p>{{end}}
    <p class="version">Plexmor {{.Version}}</p>
  </div>
</main>
<script nonce="{{.Nonce}}">
{{template "langscript" .}}
const msg = document.getElementById('msg');
const say = (t, err) => { msg.textContent = t; msg.classList.toggle('error', !!err); };
document.getElementById('login').onclick = async (ev) => {
  const btn = ev.currentTarget;
  btn.disabled = true;
  const popup = window.open('', 'plexlogin', 'width=520,height=720');
  try {
    const r = await fetch('/login/start', {method: 'POST'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (popup) popup.location = d.url; else window.open(d.url, '_blank');
    say({{t "login.wait"}});
    const started = Date.now();
    const tick = async () => {
      if (Date.now() - started > 10 * 60 * 1000) { say({{t "login.expired"}}, true); btn.disabled = false; return; }
      const c = await fetch('/login/check');
      const j = await c.json();
      if (j.ok) { if (popup) popup.close(); location.reload(); return; }
      if (!c.ok) { say(j.error || {{t "login.failed"}}, true); btn.disabled = false; if (popup) popup.close(); return; }
      setTimeout(tick, 2000);
    };
    setTimeout(tick, 2000);
  } catch (e) {
    if (popup) popup.close();
    say(e.message || {{t "login.unreachable"}}, true);
    btn.disabled = false;
  }
};
</script>
</body>
</html>
