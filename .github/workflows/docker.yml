name: Imagen Docker

# Ramas: publica :<rama> y :sha-<commit> para probar.
# Versión estable X.Y.Z    -> :X.Y.Z :X.Y :stable :latest y release.
# Versión beta X.Y.Z-rc.N  -> :X.Y.Z-rc.N :beta y pre-release.
# Se lanza en Actions > Imagen Docker > Run workflow (rama main) con "version" (p. ej. 0.3.0).
# Necesita los secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN; sin ellos solo construye.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. 0.3.0). Vacío = solo construir la rama"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Una versión solo se publica si las pruebas pasan en ese mismo commit.
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # usa la versión de "toolchain"
          cache: false
      - run: go vet ./... && go test -race -count=1 ./...

  docker:
    needs: test
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # etiqueta y release de las versiones
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'jmorunofdz' }}/plexmor
      VERSION: ${{ inputs.version || '' }}
      PUSH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar versión
        if: env.VERSION != ''
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Versión no válida: $VERSION"; exit 1; }
          [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Las versiones solo se publican desde main"; exit 1; }
          [ "$PUSH" = true ] || { echo "::error::Faltan los secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md no tiene la sección [$VERSION]"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "::error::v$VERSION ya existe"; exit 1; fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=stable,enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=latest,enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=beta,enable=${{ contains(env.VERSION, '-') }}
            type=ref,event=branch,enable=${{ env.VERSION == '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=Plexmor
            org.opencontainers.image.description=Stremio addon for your Plex servers and the ones shared with you
            org.opencontainers.image.licenses=MIT

      - name: Versión del binario
        run: |
          if [ -n "$VERSION" ]; then echo "BUILD_VERSION=v$VERSION" >> "$GITHUB_ENV"
          else echo "BUILD_VERSION=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Compila en la plataforma del runner para cada arquitectura (sin emulación)
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: VERSION=${{ env.BUILD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Procedencia y lista de componentes (SBOM) firmadas junto a la imagen
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Descripción en Docker Hub
        if: env.VERSION != '' && !contains(env.VERSION, '-')
        continue-on-error: true # necesita un token con permiso Read, Write, Delete
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/plexmor
          short-description: Stremio addon for your Plex servers and the ones shared with you
          readme-filepath: ./README.en.md
          enable-url-completion: true

      - name: Crear etiqueta y release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == *-* ]]; then canal=beta; extra=--prerelease; else canal=stable; extra=--latest; fi
          notas=$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" $extra \
            --notes "$notas"$'\n\n'"Imagen: \`docker pull $IMAGE:$VERSION\` (canal \`$canal\`)"
