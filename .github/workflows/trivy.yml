name: Trivy

# Escaneo de vulnerabilidades de la imagen Docker.
# Falla si hay vulnerabilidades CRITICAL con arreglo disponible. El informe HIGH y CRITICAL va a la
# pestaña Security cuando el repositorio es público (en privados necesita GitHub Code Security).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build -t local/scan:${{ github.sha }} .
      - name: Informe (HIGH y CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Comprobar (falla con CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Informe SARIF
        if: ${{ always() && !github.event.repository.private }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && !github.event.repository.private && hashFiles('trivy.sarif') != '' }}
        with:
          sarif_file: trivy.sarif
          category: trivy
